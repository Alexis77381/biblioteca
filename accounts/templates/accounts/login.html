<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - Librería Online</title>
</head>
<body>
    <h1>Iniciar Sesión</h1>

    {% if form.errors %}
        <p style="color: red;">Tu usuario o contraseña son incorrectos. Inténtalo de nuevo.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Entrar</button>
    </form>

    <br>
    <a href="{% url 'book_list' %}">← Volver al catálogo</a>
</body>
</html>
